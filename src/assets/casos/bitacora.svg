  <!--
    Icono de Bitácora. Fuente de la que salen el .ico y los PNG: si hay que
    retocar la marca, se retoca aquí y se vuelve a rasterizar.

    Un cuaderno abierto con un brote saliendo de él: el registro y el crecimiento,
    que son las dos ideas del nombre. En un solo tono, separando las formas con aire
    en vez de con un segundo color.
  -->
