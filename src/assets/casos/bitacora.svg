      <stop offset="0" stop-color="#2E7D52"/>
      <stop offset="1" stop-color="#1F5B3B"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" ry="12" fill="url(#baldosa)"/>

