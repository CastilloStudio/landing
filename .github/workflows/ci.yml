name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build

      # El aviso legal lleva marcadores «así» hasta que se rellenan los datos
      # fiscales. Que la web no pueda publicarse a medio rellenar.
      - name: Comprobar que no quedan marcadores sin rellenar
        run: |
          if grep -rn '«' src/ dist/ 2>/dev/null; then
            echo "::error::Quedan marcadores sin rellenar (ver src/config.ts)"
            exit 1
          fi
